name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        env:
          CI: true
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npx vite build

      - name: Garantir google-services.json (Auto-criação se ausente)
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json
            echo "✅ google-services.json gerado a partir do secret GOOGLE_SERVICES_JSON_BASE64"
          elif [ -f "android/app/google-services.json" ] && [ -s "android/app/google-services.json" ]; then
            echo "✅ google-services.json encontrado no repositório"
          else
            echo "⚙️ Criando google-services.json oficial automaticamente..."
            cat << 'EOF' > android/app/google-services.json
{
  "project_info": {
    "project_number": "236236898494",
    "project_id": "bolao-entre-amigos-78804",
    "storage_bucket": "bolao-entre-amigos-78804.firebasestorage.app"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:236236898494:android:99db34cd046957e8f25eef",
        "android_client_info": {
          "package_name": "com.gkdmobility.app"
        }
      },
      "oauth_client": [],
      "api_key": [
        {
          "current_key": "AIzaSyASS1udwCu6mbPJFWZ--5QuZNwcupNzmv8"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": []
        }
      }
    },
    {
      "client_info": {
        "mobilesdk_app_id": "1:236236898494:android:99db34cd046957e8f25eef",
        "android_client_info": {
          "package_name": "com.lotofacil.gestor"
        }
      },
      "oauth_client": [],
      "api_key": [
        {
          "current_key": "AIzaSyASS1udwCu6mbPJFWZ--5QuZNwcupNzmv8"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": []
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF
            echo "✅ google-services.json criado automaticamente com sucesso!"
          fi
          # Confirma presença e pacote
          ls -la android/app/google-services.json
          grep "package_name" android/app/google-services.json || true

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Apply Android Icons
        run: npm run apply-android-icons

      - name: Decodificar Keystore Fixa a partir do Segredo
        run: |
          echo "Tamanho do segredo (deve ser próximo de 3664):"
          echo -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | wc -c
          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > release.keystore
            echo "✅ release.keystore decodificado a partir do segredo DEBUG_KEYSTORE_BASE64"
            ls -la release.keystore
          else
            echo "⚠️ Segredo DEBUG_KEYSTORE_BASE64 não encontrado — build vai usar assinatura aleatória"
          fi

      - name: Configurar Keystore Fixo para Assinatura Consistente
        run: |
          mkdir -p ~/.android
          if [ -f "release.keystore" ]; then
            cp release.keystore ~/.android/debug.keystore
            echo "✅ Keystore fixo configurado em ~/.android/debug.keystore (garante mesma assinatura em todos os builds)"
          fi

      - name: Verificar signingConfig do App
        run: |
          if grep -q "android.signingConfigs.debug.storeFile" android/app/build.gradle; then
            echo "ℹ️ signingConfig já configurado no android/app/build.gradle"
          else
            echo "ℹ️ signingConfig não detectado, adicionando..."
            cat >> android/app/build.gradle << 'EOF'

android.signingConfigs.debug.storeFile = new File(System.getProperty("user.home") + "/.android/debug.keystore")
android.signingConfigs.debug.storePassword = "android"
android.signingConfigs.debug.keyAlias = "androiddebugkey"
android.signingConfigs.debug.keyPassword = "android"
android.buildTypes.debug.signingConfig = android.signingConfigs.debug
EOF
          fi

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verificar Fingerprint da Assinatura do APK
        continue-on-error: true
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          echo "=== Fingerprint da assinatura deste APK (compare entre builds) ==="
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner nao encontrado - pulando verificacao"
            exit 0
          fi
          "$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-256\|SHA-1"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
